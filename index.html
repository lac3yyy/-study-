<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Burrow</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #d8e5a6;
      --panel-bg: #eceec9;
      --border-color: #3f3b2b;
      --btn-bg: #f4f4dc;
      --text-color: #2b271d;
      --accent: #e76f51;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Nunito', sans-serif;
      padding: 20px;
      display: flex;
      gap: 20px;
      min-height: 100vh;
    }

    .world-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-family: 'VT323', monospace;
      font-size: 2rem;
      color: var(--text-color);
    }

    .card-slot {
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 2px 2px 0px var(--border-color);
    }

    .slot-info h3 { font-size: 1.1rem; }
    .slot-info p { font-size: 0.85rem; opacity: 0.7; }

    .btn-group { display: flex; gap: 6px; }

    button, .btn {
      background: var(--btn-bg);
      border: 2px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-color);
      box-shadow: 1px 1px 0px var(--border-color);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    button:hover { background: #fff; }

    .sidebar {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 2px 2px 0px var(--border-color);
    }

    .timer-display {
      font-family: 'VT323', monospace;
      font-size: 3.5rem;
      text-align: center;
      margin: 10px 0;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      background: var(--btn-bg);
      padding: 8px;
      border: 2px solid var(--border-color);
      border-radius: 6px;
    }

    iframe {
      width: 100%;
      height: 180px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="world-container">
    <h1 class="section-title">Burrow</h1>

    <div class="card-slot">
      <div class="slot-info">
        <h3>Apartment (Small)</h3>
        <p>Cozy Study Nook</p>
      </div>
      <div class="btn-group">
        <button onclick="playAmbient('rain')">🌧️ Rain</button>
        <button onclick="playAmbient('cafe')">☕ Cafe</button>
      </div>
    </div>

    <div class="card-slot">
      <div class="slot-info">
        <h3>Apartment (Large)</h3>
        <p>-home-4</p>
      </div>
      <div class="btn-group">
        <button>➡️ Visit</button>
        <button>⚙️ Details</button>
      </div>
    </div>

    <div class="card-slot">
      <div class="slot-info">
        <h3>Slot 3</h3>
        <p>Empty slot</p>
      </div>
      <button>+ Create Burrow</button>
    </div>

    <div class="controls-row">
      <span>Camera</span>
      <button>⚙️ Recenter</button>
      <span>Zoom</span>
      <button onclick="adjustZoom(-1)">-</button>
      <span id="zoom-lvl">3x</span>
      <button onclick="adjustZoom(1)">+</button>
    </div>
  </div>

  <div class="sidebar">
    <div class="panel">
      <h2 class="section-title" style="font-size: 1.5rem;">Focus Timer</h2>
      <div class="timer-display" id="timer">25:00</div>
      <div style="display: flex; justify-content: center; gap: 8px;">
        <button onclick="startTimer()">Start</button>
        <button onclick="pauseTimer()">Pause</button>
        <button onclick="resetTimer()">Reset</button>
      </div>
    </div>

    <div class="panel">
      <h2 class="section-title" style="font-size: 1.5rem;">Lofi Stream</h2>
      <iframe src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk?autoplay=0" allow="autoplay"></iframe>
    </div>
  </div>

  <audio id="audio-rain" loop src="https://cdn.pixabay.com/download/audio/2021/09/06/audio_8b22a012a6.mp3"></audio>
  <audio id="audio-cafe" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3"></audio>

  <script>
    let zoom = 3;
    function adjustZoom(delta) {
      zoom = Math.max(1, Math.min(5, zoom + delta));
      document.getElementById('zoom-lvl').innerText = zoom + 'x';
    }

    let timeLeft = 1500, timerId = null;
    function updateDisplay() {
      const min = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const sec = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `${min}:${sec}`;
    }
    function startTimer() {
      if (!timerId) {
        timerId = setInterval(() => {
          if (timeLeft > 0) { timeLeft--; updateDisplay(); }
          else { clearInterval(timerId); alert("Session complete!"); }
        }, 1000);
      }
    }
    function pauseTimer() { clearInterval(timerId); timerId = null; }
    function resetTimer() { pauseTimer(); timeLeft = 1500; updateDisplay(); }

    function playAmbient(type) {
      const rain = document.getElementById('audio-rain');
      const cafe = document.getElementById('audio-cafe');
      if (type === 'rain') { cafe.pause(); rain.paused ? rain.play() : rain.pause(); }
      if (type === 'cafe') { rain.pause(); cafe.paused ? cafe.play() : cafe.pause(); }
    }
  </script>
</body>
</html>
