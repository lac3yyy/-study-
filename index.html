<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Forces all relative links, CSS, and images to pull from lofi.town -->
  <base href="https://lofi.town/">
  <script>
    // Fetches the live HTML directly to bypass iframe embedding blocks
    fetch('https://lofi.town/')
      .then(response => response.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(err => console.error('Asset block:', err));
  </script>
</head>
<body>
</body>
</html>
